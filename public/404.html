<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReadBench — Library & Student Management System</title>
    <script>
      // Single Page Application redirect for GitHub Pages without infinite looping
      // If a route or 404 is encountered, redirect to base index once
      var base = location.pathname.startsWith('/Library') ? '/Library/' : '/';
      if (location.pathname !== base) {
        window.location.replace(base);
      }
    </script>
  </head>

      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">ReadBench</h2>
      <p style="font-size: 0.875rem; color: #64748b;">Loading...</p>
    </div>
  </body>
</html>
